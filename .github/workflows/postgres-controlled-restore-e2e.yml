name: Browser PostgreSQL Controlled Restore E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: browser-postgres-controlled-restore-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-postgres-controlled-restore-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the Provider and PostgreSQL controlled-restore harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: e2e/go.mod
          cache: true
          cache-dependency-path: |
            e2e/go.sum
            go.sum

      - name: Download Go modules
        working-directory: e2e
        run: go mod download

      - name: Log in to GHCR for the locked Browser and Valkey images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the locked Provider, Browser, Valkey, PostgreSQL, migration, and harness
        working-directory: e2e
        run: go run ./cmd/postgres-controlled-restore-e2e -check

      - name: Run PostgreSQL controlled-restore harness tests
        working-directory: e2e
        run: go test -race -shuffle=on -count=1 ./...

      - name: Run PostgreSQL controlled-restore harness vet
        working-directory: e2e
        run: go vet ./...

      - name: Run the same-runner PostgreSQL controlled-restore reference E2E
        working-directory: e2e
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/postgres-controlled-restore-e2e -evidence-root evidence/postgres-controlled-restore

      - name: Upload sanitized PostgreSQL controlled-restore evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-postgres-controlled-restore-e2e-evidence-${{ github.run_id }}
          path: e2e/evidence/postgres-controlled-restore
          if-no-files-found: error
          retention-days: 14
