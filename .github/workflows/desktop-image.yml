name: Desktop Image Publication

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-image-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sandbox-runtime-desktop

jobs:
  build-platform:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            source_digest: sha256:1beb0dc0a51de7ff38e3b5274078a2e0b81113ba5c7535e1a03d5913a5edbda3
            package_archive_digest: sha256:591fef77f3bdbac861ef71ad7cfca7ef6e86a0ac092a7c10084118af10f40097
            artifact_suffix: amd64
          - platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
            source_digest: sha256:d858bb5442632a31bd4bca6c5e601dbe6b536fd7942092ea6a08a0a95805693c
            package_archive_digest: sha256:28468a7b60dc3228ae95f738e7083f6c41b02d381aa1ae6f42afe8424e9a4727
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Run the native Desktop image gate
        env:
          SANDBOX_RUNTIME_DESKTOP_IMAGE_INTEGRATION: "1"
          SANDBOX_RUNTIME_DESKTOP_PLATFORM: ${{ matrix.platform }}
        run: go test -tags=integration -count=1 -run '^TestDesktopImageNativeIntegration$' ./profiles/desktop/image

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the exact platform image
        env:
          PLATFORM: ${{ matrix.platform }}
          PLATFORM_ID: ${{ matrix.artifact_suffix }}
          SOURCE_DIGEST: ${{ matrix.source_digest }}
          PACKAGE_ARCHIVE_DIGEST: ${{ matrix.package_archive_digest }}
        run: |
          reference="${IMAGE_NAME}:platform-${PLATFORM_ID}-${GITHUB_SHA}"
          ./profiles/desktop/image/build.sh "${PLATFORM}" "${reference}" "${GITHUB_SHA}"
          test "$(docker image inspect --format '{{index .Config.Labels "io.github.shell-echo.sandbox-runtime.provenance.source-digest"}}' "${reference}")" = "${SOURCE_DIGEST}"
          test "$(docker image inspect --format '{{index .Config.Labels "io.github.shell-echo.sandbox-runtime.package-archive-set-digest"}}' "${reference}")" = "${PACKAGE_ARCHIVE_DIGEST}"

      - name: Push and record the content manifest
        env:
          PLATFORM_ID: ${{ matrix.artifact_suffix }}
        run: |
          reference="${IMAGE_NAME}:platform-${PLATFORM_ID}-${GITHUB_SHA}"
          docker push "${reference}"
          digest="$(docker buildx imagetools inspect "${reference}" --format '{{json .Manifest}}' | jq -r .digest)"
          test "${digest#sha256:}" != "${digest}"
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${PLATFORM_ID}-${digest#sha256:}"

      - name: Upload the platform manifest digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-image-digest-${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-index:
    if: github.ref == 'refs/heads/main'
    needs: build-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download the platform manifest digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the immutable multi-platform index
        id: index
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -print | sort)
          test "${#digest_files[@]}" -eq 2
          mkdir -p "${RUNNER_TEMP}/descriptors"
          descriptor_args=()
          for digest_file in "${digest_files[@]}"; do
            filename="$(basename "${digest_file}")"
            platform_id="${filename%%-*}"
            digest="${filename#*-}"
            case "${platform_id}" in
              amd64) platform_json='{"architecture":"amd64","os":"linux"}' ;;
              arm64) platform_json='{"architecture":"arm64","os":"linux","variant":"v8"}' ;;
              *) exit 1 ;;
            esac
            descriptor_path="${RUNNER_TEMP}/descriptors/${platform_id}.json"
            docker buildx imagetools inspect "${IMAGE_NAME}@sha256:${digest}" --format '{{json .Manifest}}' \
              | jq --argjson platform "${platform_json}" '.platform = $platform' > "${descriptor_path}"
            descriptor_args+=(--file "${descriptor_path}")
          done
          docker buildx imagetools create --tag "${IMAGE_NAME}:${IMAGE_TAG}" "${descriptor_args[@]}"
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format '{{json .Manifest}}')"
          jq -e '(.manifests | map(.platform) | sort_by(.architecture)) == ([{"architecture":"amd64","os":"linux"},{"architecture":"arm64","os":"linux","variant":"v8"}] | sort_by(.architecture))' <<< "${manifest}" >/dev/null
          echo "digest=$(jq -r .digest <<< "${manifest}")" >> "${GITHUB_OUTPUT}"

      - name: Attest the published index with GitHub OIDC
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  independent-verify:
    if: github.ref == 'refs/heads/main'
    needs: publish-index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Independently verify signer, source, and hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish-index.outputs.digest }}
        run: >-
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}"
          --repo "${GITHUB_REPOSITORY}"
          --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-image.yml"
          --source-digest "${GITHUB_SHA}"
          --deny-self-hosted-runners

      - name: Independently verify the exact architecture matrix
        env:
          DIGEST: ${{ needs.publish-index.outputs.digest }}
        run: |
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" --format '{{json .Manifest}}')"
          jq -e '(.manifests | map(.platform) | sort_by(.architecture)) == ([{"architecture":"amd64","os":"linux"},{"architecture":"arm64","os":"linux","variant":"v8"}] | sort_by(.architecture))' <<< "${manifest}" >/dev/null
          echo "Verified ${IMAGE_NAME}@${DIGEST} from ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
