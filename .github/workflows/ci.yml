name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify locked local Provider Contract
        run: go run ./cmd/verify-contract -source-root .
      - name: Validate Provider v1 DTO projection and fixtures
        run: go test -count=1 ./providerapi/v1 -run '^TestLockedContractProjection$'
      - name: Validate Provider capability response projection
        run: go test -count=1 ./providerapi -run '^TestLockedCapabilityResponseSchema$'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -race -shuffle=on -count=1 ./...
      - run: go vet ./...

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Run Docker integration test
        env:
          SANDBOX_RUNTIME_DOCKER_INTEGRATION: "1"
        run: go test -tags=integration -count=1 ./driver/docker
