name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-contract-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: CelestialsGroup/agent-blueprints
          ref: 0c91871fa469e951b8a508fe735a2a9a5797a67e
          path: .agent-contract-source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify locked Agent Contract inputs
        run: go run ./cmd/verify-agent-contract -source-root .agent-contract-source
      - name: Validate Provider v1 DTO projection and fixtures
        env:
          AGENT_CONTRACT_SOURCE_ROOT: ${{ github.workspace }}/.agent-contract-source
        run: go test -count=1 ./providerapi/v1 -run '^TestLockedContractProjection$'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -race -shuffle=on -count=1 ./...
      - run: go vet ./...

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Run Docker integration test
        env:
          SANDBOX_RUNTIME_DOCKER_INTEGRATION: "1"
        run: go test -tags=integration -count=1 ./driver/docker
