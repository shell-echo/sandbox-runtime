name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify locked local Provider Contract
        run: go run ./cmd/verify-contract -source-root .
      - name: Validate Provider v1 DTO projection and fixtures
        run: go test -count=1 ./providerapi/v1 -run '^TestLockedContractProjection$'
      - name: Validate Provider capability response projection
        run: go test -count=1 ./providerapi -run '^TestLockedCapabilityResponseSchema$'
      - name: Execute local Provider Conformance Suite
        run: go run ./cmd/run-conformance -source-root .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -race -shuffle=on -count=1 ./...
      - run: go vet ./...

  browser-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify locked Browser image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SANDBOX_RUNTIME_BROWSER_PROVENANCE_INTEGRATION: "1"
        run: go test -tags=integration -count=1 ./provider/browser/provenance/ghcli

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Run Docker integration test
        env:
          SANDBOX_RUNTIME_DOCKER_INTEGRATION: "1"
        run: go test -tags=integration -count=1 ./cmd ./driver/docker ./provider/lifecycle/driver/docker
