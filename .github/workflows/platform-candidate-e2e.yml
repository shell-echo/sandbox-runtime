name: Platform Candidate E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-candidate-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-candidate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the Provider and candidate harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: e2e/go.mod
          cache: true
          cache-dependency-path: |
            e2e/go.sum
            go.sum

      - name: Download Go modules
        working-directory: e2e
        run: go mod download

      - name: Verify the locked Provider, Contract, and candidate mode
        working-directory: e2e
        run: go run ./cmd/platform-e2e -check

      - name: Run candidate harness tests
        working-directory: e2e
        run: go test -race -shuffle=on -count=1 ./...

      - name: Run candidate harness vet
        working-directory: e2e
        run: go vet ./...

      - name: Run the Agent Platform candidate E2E
        working-directory: e2e
        run: go run ./cmd/platform-e2e -source-image local -evidence-root evidence/platform-candidate

      - name: Upload sanitized candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-candidate-e2e-evidence-${{ github.run_id }}
          path: e2e/evidence/platform-candidate
          if-no-files-found: warn
          retention-days: 14
