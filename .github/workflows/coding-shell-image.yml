name: Coding Shell Image Publication

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: coding-shell-image-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sandbox-runtime-coding-shell

jobs:
  build-platform:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            goarch: amd64
            runner: ubuntu-24.04
            source_digest: sha256:1beb0dc0a51de7ff38e3b5274078a2e0b81113ba5c7535e1a03d5913a5edbda3
            artifact_suffix: amd64
          - platform: linux/arm64/v8
            goarch: arm64
            runner: ubuntu-24.04-arm
            source_digest: sha256:d858bb5442632a31bd4bca6c5e601dbe6b536fd7942092ea6a08a0a95805693c
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the locked Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Run the native coding/shell image integration gate
        env:
          SANDBOX_RUNTIME_CODING_SHELL_IMAGE_INTEGRATION: "1"
        run: >-
          go test -tags=integration -count=1
          -run '^TestCodingShellImageIntegration$'
          ./profiles/coding-shell/image

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the content-addressed platform manifest
        id: build
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          GOARCH: ${{ matrix.goarch }}
          SOURCE_DIGEST: ${{ matrix.source_digest }}
          PLATFORM_ID: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.5"
          build_context="$(mktemp -d "${RUNNER_TEMP}/coding-shell-image.XXXXXX")"
          trap 'rm -rf -- "${build_context}"' EXIT
          CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" \
            go build -trimpath -buildvcs=false -ldflags=-buildid= \
            -o "${build_context}/terminal-broker" ./cmd/terminal-broker
          chmod 0555 "${build_context}/terminal-broker"
          touch -t 197001010000 "${build_context}/terminal-broker"
          cp profiles/coding-shell/image/Dockerfile "${build_context}/Dockerfile"
          metadata="${RUNNER_TEMP}/coding-shell-image-metadata.json"
          docker buildx build \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --platform "${PLATFORM}" \
            --build-arg "BASE_IMAGE_DIGEST=${SOURCE_DIGEST}" \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${metadata}" \
            "${build_context}"
          digest="$(jq -er '."containerimage.digest"' "${metadata}")"
          test "${digest#sha256:}" != "${digest}"
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${PLATFORM_ID}-${digest#sha256:}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify the pushed platform manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" --format '{{json .Manifest}}')"
          jq -e --arg digest "${DIGEST}" '.digest == $digest and .size > 0' <<< "${manifest}" > /dev/null

      - name: Upload the platform manifest digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coding-shell-image-digest-${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-index:
    if: github.ref == 'refs/heads/main'
    needs: build-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download the platform manifest digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coding-shell-image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the immutable multi-platform index
        id: index
        shell: bash
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -print | sort)
          test "${#digest_files[@]}" -eq 2
          mkdir -p "${RUNNER_TEMP}/descriptors"
          descriptor_args=()
          seen_amd64=0
          seen_arm64=0
          for digest_file in "${digest_files[@]}"; do
            filename="$(basename "${digest_file}")"
            platform_id="${filename%%-*}"
            digest="${filename#*-}"
            test "${#digest}" -eq 64
            case "${platform_id}" in
              amd64)
                test "${seen_amd64}" = "0"
                platform_json='{"architecture":"amd64","os":"linux"}'
                seen_amd64=1
                ;;
              arm64)
                test "${seen_arm64}" = "0"
                platform_json='{"architecture":"arm64","os":"linux","variant":"v8"}'
                seen_arm64=1
                ;;
              *)
                exit 1
                ;;
            esac
            descriptor_path="${RUNNER_TEMP}/descriptors/${platform_id}.json"
            docker buildx imagetools inspect "${IMAGE_NAME}@sha256:${digest}" --format '{{json .Manifest}}' \
              | jq --argjson platform "${platform_json}" '.platform = $platform' > "${descriptor_path}"
            jq -e --arg digest "sha256:${digest}" --argjson platform "${platform_json}" \
              '.digest == $digest and .size > 0 and .platform == $platform' \
              "${descriptor_path}" > /dev/null
            descriptor_args+=(--file "${descriptor_path}")
          done
          test "${seen_amd64}" = "1"
          test "${seen_arm64}" = "1"
          docker buildx imagetools create --tag "${IMAGE_NAME}:${IMAGE_TAG}" "${descriptor_args[@]}"
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" --format '{{json .Manifest}}')"
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | map(.platform) | sort_by(.architecture)) ==
              ([
                {"architecture":"amd64","os":"linux"},
                {"architecture":"arm64","os":"linux","variant":"v8"}
              ] | sort_by(.architecture))
          ' <<< "${manifest}" > /dev/null
          digest="$(jq -r .digest <<< "${manifest}")"
          test "${digest#sha256:}" != "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest the published index with GitHub OIDC
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Verify the signed provenance and signer identity
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: >-
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}"
          --repo "${GITHUB_REPOSITORY}"
          --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/coding-shell-image.yml"
          --source-digest "${GITHUB_SHA}"
          --deny-self-hosted-runners

      - name: Record the immutable publication identity
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: |
          set -euo pipefail
          echo "### Coding/shell image publication" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Source: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image: \`${IMAGE_NAME}@${DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Tag: \`sha-${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Attestation: \`${ATTESTATION_ID}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Provenance: GitHub OIDC/SLSA, verified in this job" >> "${GITHUB_STEP_SUMMARY}"
