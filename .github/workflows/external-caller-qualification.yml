name: External caller qualification

on:
  workflow_dispatch:
    inputs:
      external_caller_ref:
        description: Immutable sandbox-runtime-external-caller commit
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Provider authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: provider
          fetch-depth: 0
          persist-credentials: false

      - name: Check out independent caller candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shell-echo/sandbox-runtime-external-caller
          ref: ${{ inputs.external_caller_ref }}
          path: external-caller
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: |
            provider/go.sum
            external-caller/go.sum

      - name: Build exact qualification executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification/build"
          CGO_ENABLED=0 go -C provider build -trimpath -o "$RUNNER_TEMP/qualification/build/provider" .
          CGO_ENABLED=0 go -C provider build -trimpath -o "$RUNNER_TEMP/qualification/build/operator" ./cmd/run-external-caller-qualification
          go -C external-caller run ./cmd/release-artifacts \
            -source-root "$GITHUB_WORKSPACE/external-caller" \
            -output "$RUNNER_TEMP/qualification/candidate" \
            -goos linux \
            -goarch amd64

      - name: Run native Linux amd64 qualification
        shell: bash
        run: |
          set -euo pipefail
          provider_revision=$(git -C provider rev-parse HEAD)
          external_revision=$(git -C external-caller rev-parse HEAD)
          run_root="$RUNNER_TEMP/qualification/run"
          docker pull ghcr.io/shell-echo/sandbox-runtime-coding-shell@sha256:1996e44f8ddc464f22556bd57f1c69079fe6b1a821b65bd9be24f86619c31bb1
          resolver_backup="$RUNNER_TEMP/qualification/resolv.conf"
          sudo cp /etc/resolv.conf "$resolver_backup"
          restore_resolver() {
            sudo cp "$resolver_backup" /etc/resolv.conf
          }
          trap restore_resolver EXIT
          printf 'nameserver 127.0.0.1\noptions ndots:1 timeout:1 attempts:1\n' | sudo tee /etc/resolv.conf > /dev/null
          sudo env PATH="$PATH" "$RUNNER_TEMP/qualification/build/operator" \
            -source-root "$GITHUB_WORKSPACE/provider" \
            -run-root "$run_root" \
            -provider-executable "$RUNNER_TEMP/qualification/build/provider" \
            -operator-executable "$RUNNER_TEMP/qualification/build/operator" \
            -candidate-directory "$RUNNER_TEMP/qualification/candidate/artifacts" \
            -provider-source-revision "$provider_revision" \
            -external-source-revision "$external_revision" \
            -docker-socket /var/run/docker.sock
          restore_resolver
          trap - EXIT
          sudo test -f "$run_root/execution-checkpoint.json"
          sudo cp "$run_root/execution-checkpoint.json" "$RUNNER_TEMP/qualification/execution-checkpoint.json"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/qualification/execution-checkpoint.json"

      - name: Upload execution checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-caller-execution-checkpoint
          path: ${{ runner.temp }}/qualification/execution-checkpoint.json
          if-no-files-found: error
          retention-days: 14
