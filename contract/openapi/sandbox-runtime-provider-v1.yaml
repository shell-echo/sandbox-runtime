components:
  parameters:
    AdmissionContextHeader:
      name: X-Sandbox-Runtime-Admission-Context
      in: header
      required: true
      description: >-
        Exactly one header field value containing the unpadded base64url
        encoding of the closed Admission Context document. The encoded value
        and decoded document are each bounded to 16,384 bytes.
      schema:
        type: string
        minLength: 1
        maxLength: 16384
        pattern: '^[A-Za-z0-9_-]+$'
      x-exactly-one-value: true
      x-content-encoding: base64url-unpadded
      x-max-decoded-bytes: 16384
      x-decoded-schema:
        $ref: ../schemas/admission-context.schema.json
    RuntimeSessionHandoffHeader:
      name: X-Sandbox-Runtime-Session-Handoff
      in: header
      required: true
      description: >-
        Exactly one header field value containing the unpadded base64url
        encoding of the closed terminal connect descriptor. The encoded value
        is bounded to 5,462 characters and the decoded document to 4,096 bytes.
      schema:
        type: string
        minLength: 1
        maxLength: 5462
        pattern: '^[A-Za-z0-9_-]+$'
      x-exactly-one-value: true
      x-content-encoding: base64url-unpadded
      x-max-decoded-bytes: 4096
      x-decoded-schema:
        $ref: ../schemas/runtime-session-connect-descriptor.schema.json
  schemas:
    AdmissionContext:
      $ref: ../schemas/admission-context.schema.json
    AdmissionTarget:
      $ref: ../schemas/admission-target.schema.json
    ProviderError:
      $ref: ../schemas/provider-error.schema.json
  securitySchemes:
    mutualTLS:
      type: mutualTLS
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: compact-jws
      description: >-
        Compact JWS protected-operation token using the closed Contract header
        and claims profiles. The exact issuer, audience, Provider revision,
        admitted URI SAN identities, and verification keys are configured for
        the Provider listener as defined by the semantic rules.
      x-max-encoded-bytes: 8192
      x-jws-profile:
        serialization: compact
