openapi: 3.1.1
info:
  title: Shell Echo Sandbox Runtime Provider API
  version: 1.0.0
  x-contract-namespace: urn:shell-echo:sandbox-runtime:provider-v1
  x-contract-license: MIT
servers:
  - url: https://provider.invalid
paths:
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Discover immutable provider capabilities
      security:
        - mutualTLS: []
      responses:
        '200':
          description: Immutable empty, terminal-only, or coding/shell capability snapshot
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-capabilities.schema.json
        '400':
          description: Request metadata is not empty or supported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Client identity is not admitted
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '500':
          description: Provider failed to construct its immutable snapshot
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '501':
          description: HTTP parser rejected an unsupported transfer coding
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes:
    post:
      operationId: createSandbox
      summary: Accept an idempotent asynchronous sandbox creation request
      security:
        - mutualTLS: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/create-sandbox-request.schema.json
      x-max-encoded-body-bytes: 1048576
      responses:
        '202':
          description: Creation operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, attempt, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Requested runtime or capability profile is unsupported or is not an exact advertised combination
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '429':
          description: Provider capacity is temporarily exhausted
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}:
    get:
      operationId: getSandboxStatus
      summary: Read provider-local sandbox desired and observed state
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      responses:
        '200':
          description: Current provider-local sandbox status
          content:
            application/json:
              schema:
                $ref: ../schemas/sandbox-status.schema.json
        '400':
          description: Request metadata or path is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Sandbox is not known to this provider revision
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/exec:
    post:
      operationId: startSandboxExec
      summary: Accept a bounded asynchronous process execution request
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/exec-request.schema.json
      x-max-encoded-body-bytes: 262144
      responses:
        '202':
          description: Execution operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Execution request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Execution is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, attempt, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Requested execution policy is unsupported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '429':
          description: Provider execution capacity is temporarily exhausted
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/artifacts:stage:
    post:
      operationId: stageSandboxArtifact
      summary: Accept a bounded provider-local artifact staging request
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/artifact-staging-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Artifact staging operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Artifact staging request document or metadata is invalid, including an encoded body over the operation limit
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Artifact staging is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Artifact staging policy or content checks are unsupported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '410':
          description: Artifact staging request evidence has expired
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining, temporarily unavailable, or cannot safely complete durable acceptance
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/exec:cancel:
    post:
      operationId: cancelSandboxExec
      summary: Record cancellation intent for an execution operation
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/cancel-exec-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Cancellation intent accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Cancellation request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Cancellation is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Target execution operation is not known to this provider revision
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, attempt, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Target execution cannot accept cancellation
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/runtime-sessions:
    post:
      operationId: openTerminalRuntimeSession
      summary: Accept an asynchronous terminal session request
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/runtime-session-open-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Terminal-session open operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Session request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Session is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, attempt, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Terminal capability, profile, or sandbox state is unsupported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '429':
          description: Provider terminal-session capacity is temporarily exhausted
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/operations/{operation_id}:
    get:
      operationId: getOperation
      summary: Read bounded asynchronous provider operation state
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      responses:
        '200':
          description: Current provider-local operation state from the owning operation family, including artifact_stage operations
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Request metadata or path is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Operation is not known by any composed operation-family authority in this provider revision
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '410':
          description: Operation evidence has expired
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/operations/{operation_id}/exec-result:
    get:
      operationId: getExecResult
      summary: Read a bounded retained execution result
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      responses:
        '200':
          description: Retained execution result
          content:
            application/json:
              schema:
                $ref: ../schemas/exec-result.schema.json
        '400':
          description: Request metadata or path is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Execution result is not known to this provider revision
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '410':
          description: Retained execution result has expired
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/operations/{operation_id}/artifact-staging-evidence:
    get:
      operationId: getArtifactStagingEvidence
      summary: Read bounded provider-local artifact staging evidence
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      responses:
        '200':
          description: Artifact staging evidence
          content:
            application/json:
              schema:
                $ref: ../schemas/artifact-staging-evidence.schema.json
        '400':
          description: Request metadata or path is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Artifact staging operation is unknown or completed with no evidence because its source was missing
          x-error-codes:
            - code: SANDBOX_ARTIFACT_EVIDENCE_NOT_FOUND
              retryable: false
              conditions: [unknown_operation, source_missing]
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '410':
          description: Artifact staging evidence has expired
          x-error-codes:
            - code: SANDBOX_ARTIFACT_EVIDENCE_EXPIRED
              retryable: false
              conditions: [expired]
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Artifact staging evidence is pending, the staging outcome is unknown and requires reconciliation, or the provider is temporarily unavailable
          x-error-codes:
            - code: SANDBOX_ARTIFACT_EVIDENCE_PENDING
              retryable: true
              conditions: [accepted, running]
            - code: SANDBOX_ARTIFACT_OUTCOME_UNKNOWN
              retryable: true
              reconciliation_required: true
              conditions: [outcome_unknown]
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/operations/{operation_id}/usage-evidence:
    get:
      operationId: getUsageEvidence
      summary: Read bounded provider-local usage evidence
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      responses:
        '200':
          description: Usage evidence for one provider-local operation
          content:
            application/json:
              schema:
                $ref: ../schemas/usage-evidence.schema.json
        '400':
          description: Request metadata or path is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Usage evidence is not known for this provider-local operation
          x-error-codes:
            - code: SANDBOX_USAGE_EVIDENCE_NOT_FOUND
              retryable: false
              conditions: [unknown_operation, no_evidence]
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '410':
          description: Usage evidence has expired
          x-error-codes:
            - code: SANDBOX_USAGE_EVIDENCE_EXPIRED
              retryable: false
              conditions: [expired]
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Known usage evidence is not yet readable or the provider is temporarily unable to read it
          x-error-codes:
            - code: SANDBOX_USAGE_EVIDENCE_UNAVAILABLE
              retryable: true
              conditions: [known_not_yet_readable, temporarily_unavailable]
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/operations/{operation_id}/runtime-session:
    get:
      operationId: getRuntimeSessionHandoff
      summary: Read a bounded terminal session handoff document
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      responses:
        '200':
          description: Opaque terminal session handoff document
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime-session-handoff.schema.json
        '400':
          description: Request metadata or path is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Terminal session operation is not known to this provider revision
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '410':
          description: Terminal session handoff has expired
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
components:
  schemas:
    AdmissionContext:
      $ref: ../schemas/admission-context.schema.json
    AdmissionTarget:
      $ref: ../schemas/admission-target.schema.json
    ProviderError:
      $ref: ../schemas/provider-error.schema.json
  securitySchemes:
    mutualTLS:
      type: mutualTLS
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: compact-jws
