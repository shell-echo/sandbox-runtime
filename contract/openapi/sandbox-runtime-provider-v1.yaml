openapi: 3.1.1
info:
  title: Shell Echo Sandbox Runtime Provider API
  version: 1.0.0
  x-contract-namespace: urn:shell-echo:sandbox-runtime:provider-v1
  x-contract-license: MIT
servers:
  - url: https://provider.invalid
paths:
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Discover immutable provider capabilities
      security:
        - mutualTLS: []
      responses:
        '200':
          description: Immutable empty, terminal, terminal-connect, coding/shell, or browser capability snapshot
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-capabilities.schema.json
        '400':
          description: Request metadata is not empty or supported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Client identity is not admitted
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '500':
          description: Provider failed to construct its immutable snapshot
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '501':
          description: HTTP parser rejected an unsupported transfer coding
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes:
    post:
      operationId: createSandbox
      summary: Accept an idempotent asynchronous sandbox creation request
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/create-sandbox-request.schema.json
      x-max-encoded-body-bytes: 1048576
      responses:
        '202':
          description: Creation operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, attempt, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Requested runtime or capability profile is unsupported or is not an exact advertised combination
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '429':
          description: Provider capacity is temporarily exhausted
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}:
    get:
      operationId: getSandboxStatus
      summary: Read provider-local sandbox desired and observed state
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      responses:
        '200':
          description: Current provider-local sandbox status
          content:
            application/json:
              schema:
                $ref: ../schemas/sandbox-status.schema.json
        '400':
          description: Request metadata or path is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Sandbox is not known to this provider revision
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/desired-state:
    post:
      operationId: setSandboxDesiredState
      summary: Accept an idempotent suspend or resume request
      x-required-capability:
        id: sandbox.lifecycle-control
        version: 1.0.0
        profile: lifecycle-control-v1
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/desired-state-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Desired-state operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Lifecycle control is not advertised or the transition is unsupported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider cannot safely accept or reconcile the request
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/lease:
    post:
      operationId: extendSandboxLease
      summary: Accept a bounded execution-lease extension
      x-required-capability:
        id: sandbox.lifecycle-control
        version: 1.0.0
        profile: lifecycle-control-v1
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/lease-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Lease-extension operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Lifecycle control is not advertised or the extension exceeds Provider limits
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider cannot safely accept the request
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}:terminate:
    post:
      operationId: terminateSandbox
      summary: Accept an irreversible sandbox termination request
      x-required-capability:
        id: sandbox.lifecycle-control
        version: 1.0.0
        profile: lifecycle-control-v1
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/terminate-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Termination operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Lifecycle control is not advertised or the target cannot be terminated
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider cannot safely accept or reconcile cleanup
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/events:
    get:
      operationId: getSandboxLifecycleEvents
      summary: Read one finite page of retained lifecycle events
      x-required-capability:
        id: sandbox.lifecycle-control
        version: 1.0.0
        profile: lifecycle-control-v1
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
      responses:
        '200':
          description: Finite event page after the exclusive cursor
          content:
            application/json:
              schema:
                $ref: ../schemas/lifecycle-event-page.schema.json
        '400':
          description: Request metadata, path, or cursor is malformed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Request is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Sandbox is not known to this Provider revision
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Cursor is ahead of the latest retained sequence
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '410':
          description: Cursor is behind the first retained sequence
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Lifecycle control is not advertised
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider cannot safely read retained events
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/exec:
    post:
      operationId: startSandboxExec
      summary: Accept a bounded asynchronous process execution request
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/exec-request.schema.json
      x-max-encoded-body-bytes: 262144
      responses:
        '202':
          description: Execution operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Execution request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Execution is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, attempt, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Requested execution policy is unsupported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '429':
          description: Provider execution capacity is temporarily exhausted
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/artifacts:stage:
    post:
      operationId: stageSandboxArtifact
      summary: Accept a bounded provider-local artifact staging request
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/artifact-staging-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Artifact staging operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Artifact staging request document or metadata is invalid, including an encoded body over the operation limit
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Artifact staging is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Artifact staging policy or content checks are unsupported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '410':
          description: Artifact staging request evidence has expired
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining, temporarily unavailable, or cannot safely complete durable acceptance
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/exec:cancel:
    post:
      operationId: cancelSandboxExec
      summary: Record cancellation intent for an execution operation
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/cancel-exec-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Cancellation intent accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Cancellation request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Cancellation is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Target execution operation is not known to this provider revision
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, attempt, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Target execution cannot accept cancellation
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/runtime-sessions:
    post:
      operationId: openTerminalRuntimeSession
      summary: Accept an asynchronous terminal session request
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/runtime-session-open-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Terminal-session open operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Session request document or metadata is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Session is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, attempt, generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Terminal capability, profile, or sandbox state is unsupported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '429':
          description: Provider terminal-session capacity is temporarily exhausted
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Provider is draining or temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/runtime-sessions/{runtime_session_id}:close:
    post:
      operationId: closeTerminalRuntimeSession
      summary: Accept an idempotent terminal-session close request
      x-required-capability:
        id: sandbox.terminal-control
        version: 1.0.0
        profile: terminal-control-v1
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
        - name: runtime_session_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/runtime-session-close-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Terminal-session close operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Close request document, metadata, or path is invalid
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '401':
          description: Client certificate or bearer authentication failed
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '403':
          description: Close is not authorized by the admitted context
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '404':
          description: Runtime session is not known to this Provider revision
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '409':
          description: Idempotency, sandbox generation, connection generation, or fencing conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '410':
          description: Retained terminal-session authority has expired
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '422':
          description: Terminal control is not advertised or supported
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
        '503':
          description: Close outcome is unknown or cleanup is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/standard-error.schema.json
  /v1/sandboxes/{sandbox_id}/browser-sessions:
    post:
      operationId: openBrowserSession
      summary: Accept an asynchronous browser session request
      x-required-capability:
        id: sandbox.browser
        version: 1.0.0
        profile: browser-v1
      security:
        - mutualTLS: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdmissionContextHeader'
        - name: sandbox_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/browser-session-open-request.schema.json
      x-max-encoded-body-bytes: 65536
      responses:
        '202':
          description: Browser-session open operation accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/provider-operation.schema.json
        '400':
          description: Browser session request document or metadata is invalid
          content:
