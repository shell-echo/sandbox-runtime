[application]
name = 'sandbox-runtime'
mode = 'development'     # development | production; production rejects the fake runtime

[application.timezone]
name = 'Asia/Shanghai'

[application.timezone.fixed_zone]
name = 'CST'
offset = 28800 # 8 * 60 * 60

[logger]
level = 'info'    # debug | info | warn | error
add_source = false # include caller file:line in each log record

[logger.file]
name = ''               # path to log file; empty disables file output
max_size = 100          # megabytes per file before rotation
max_backups = 7         # rotated files to retain
max_age = 30            # days to retain rotated files
compress = true         # gzip rotated files

[server.api]
host = '127.0.0.1' # explicitly change only behind a trusted network boundary
port = 8080

# The Provider API is a separate, default-disabled mTLS listener. Enabling it
# requires replacing every placeholder below. Compatibility profiles are
# descriptive metadata only; they do not advertise runtime capabilities.
[server.provider.transport]
enabled = false
server_certificate_file = ''
server_private_key_file = ''
client_ca_bundle_file = ''
allowed_client_uri_identities = [] # exact absolute URI SAN identities

[server.provider.transport.address]
host = '127.0.0.1'
port = 8443

[server.provider.capability]
provider_revision_id = ''

[server.provider.capability.limits]
max_cpu_millis = 0
max_memory_bytes = 0
max_ephemeral_storage_bytes = 0
# max_workspace_bytes is optional and must be positive when set.
# max_gpu_count is optional; zero explicitly declares no GPU capacity.
max_lease_seconds = 0
max_exec_seconds = 0

# Enabling the listener requires 1..32 entries supplied through TOML. Do not
# treat this metadata as evidence that snapshot or restore is implemented.
#[[server.provider.capability.snapshot_restore_profiles]]
#profile_id = 'sandbox-snapshot-workspace-v1'
#level = 'workspace'             # workspace | filesystem | process
#suite_id = 'sandbox-provider'
#suite_version = '0.0.0'
#suite_digest = 'sha256:<64 lowercase hexadecimal characters>'

[runtime]
driver = 'fake' # fake | docker

[repository]
driver = 'memory' # memory | file; Docker and production require file

[repository.file]
path = 'data/instances.json'

[runtime.docker]
host = ''                       # empty uses DOCKER_HOST or the default Docker socket
image = 'alpine:3.23'
pull_policy = 'if_not_present'  # never | if_not_present | always
memory_bytes = 536870912        # 512 MiB
nano_cpus = 1000000000          # 1 CPU
pids_limit = 256
operation_timeout_seconds = 30  # non-pull Docker API calls
pull_timeout_seconds = 300      # image inspection and pull
stop_timeout_seconds = 10
user = '65532:65532'             # numeric non-root uid:gid inside the runtime image
namespace = 'default'             # isolates managed resources on a shared Docker daemon
controller_id = ''                # required for Docker; stable and unique across deployments
command = ['/bin/sh', '-c', "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $!; done"]
