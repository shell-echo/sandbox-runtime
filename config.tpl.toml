[application]
name = 'sandbox-runtime'
mode = 'development'     # development | production; production rejects the fake runtime

[application.timezone]
name = 'Asia/Shanghai'

[application.timezone.fixed_zone]
name = 'CST'
offset = 28800 # 8 * 60 * 60

[logger]
level = 'info'    # debug | info | warn | error
add_source = false # include caller file:line in each log record

[logger.file]
name = ''               # path to log file; empty disables file output
max_size = 100          # megabytes per file before rotation
max_backups = 7         # rotated files to retain
max_age = 30            # days to retain rotated files
compress = true         # gzip rotated files

[server.api]
host = '127.0.0.1' # explicitly change only behind a trusted network boundary
port = 8080

# Phase 6 Slices 1-2 add independent development and production-kernel Product
# modes. Start with `sandbox-runtime product serve -c /absolute/config.toml`.
# Every populated authority path below must be absolute, distinct, mode-0600,
# regular, non-symlink storage. Development uses dsn_file/bindings_file and is
# loopback-only. Production leaves those two fields empty and requires TLS,
# separate migration/runtime DSNs, exact role names and the signed key ring.
[product_process]
enabled = false
deployment_level = 'development'

[product_process.api]
host = '127.0.0.1'
port = 8082

[product_process.tls]
certificate_file = '' # production only; exact PEM certificate chain
private_key_file = ''  # production only; exact PKCS#8 PRIVATE KEY PEM

[product_process.postgres]
dsn_file = ''           # development only
migration_dsn_file = '' # production only
runtime_dsn_file = ''   # production only
migration_role = ''     # production exact current_user
runtime_role = ''       # production exact current_user; must differ
startup_timeout_seconds = 10
operation_timeout_seconds = 3
migration_max_connections = 1
max_connections = 8
min_connections = 1

[product_process.identity]
# Development-only strict sandbox-runtime-product-static-identities-v1 JSON.
bindings_file = ''
# Production-only closed signed identity policy. The key ring version is
# sandbox-runtime-product-access-key-ring-v1 and contains 1..32 Ed25519 public
# keys, explicit validity windows and revoked_key_ids. Rotation/revocation use
# process replacement; no network discovery or fallback key exists.
issuer = ''
audience = ''
key_ring_file = ''
clock_skew_seconds = 30
max_token_lifetime_seconds = 900

# Phase 6 Slice 3 independent Provider control plane. This command never starts
# the local /instances API: `sandbox-runtime provider serve -c /absolute/config.toml`.
# It is production-only, uses distinct migration/runtime PostgreSQL roles and
# selects exactly one locked Provider v1 profile because the Contract forbids
# mixed coding-shell/Desktop advertisements in a single snapshot.
[provider_process]
enabled = false
deployment_level = 'production'
profile = '' # coding_shell | desktop

[provider_process.transport]
enabled = false
# The production Provider transport is fixed to TLS 1.3 and exact client
# URI-SAN mTLS admission; there is no downgrade setting.
server_certificate_file = ''
server_private_key_file = ''
client_ca_bundle_file = ''
allowed_client_uri_identities = []

[provider_process.transport.address]
host = '127.0.0.1'
port = 8444

# Process probes contain no Provider, Product, or local API data and are
# deliberately loopback-only.
[provider_process.probe]
host = '127.0.0.1'
port = 8084

[provider_process.capability]
provider_revision_id = ''

[provider_process.capability.limits]
max_cpu_millis = 0
max_memory_bytes = 0
max_ephemeral_storage_bytes = 0
max_lease_seconds = 0
max_exec_seconds = 0

# An enabled Provider process requires 1..32 compatibility metadata entries.
# They do not advertise snapshot/restore support.
#[[provider_process.capability.snapshot_restore_profiles]]
#profile_id = 'sandbox-snapshot-workspace-v1'
#level = 'workspace'
#suite_id = 'sandbox-provider'
#suite_version = '1.0.0'
#suite_digest = 'sha256:<64 lowercase hexadecimal characters>'

[provider_process.protected_admission]
issuer = ''
provider_instance_audience = ''

#[[provider_process.protected_admission.trusted_verification_keys]]
#id = 'caller-ed25519-2026-09'
#algorithm = 'EdDSA'
#public_key_file = '/run/secrets/provider/caller-ed25519.pem'

[provider_process.postgres]
# The migration role owns schema DDL. The runtime role needs schema USAGE,
# ledger SELECT, and control_state SELECT/UPDATE only; INSERT/DELETE are unsafe.
migration_dsn_file = ''
runtime_dsn_file = ''
migration_role = ''
runtime_role = ''
startup_timeout_seconds = 10
operation_timeout_seconds = 3
migration_max_connections = 1
max_connections = 12
min_connections = 1

[provider_process.reconciliation]
interval_seconds = 1
timeout_seconds = 5

# coding_shell profile: all paths are Provider-private and absolute. Exec,
# terminal, artifact and usage state is stored transactionally in PostgreSQL.
[provider_process.coding.lifecycle]
host = ''
image = ''
pull_policy = 'if_not_present'
memory_bytes = 536870912
nano_cpus = 1000000000
pids_limit = 256
tmpfs_bytes = 67108864
operation_timeout_seconds = 30
pull_timeout_seconds = 300
stop_timeout_seconds = 10
user = '65532:65532'
command = ['/bin/sh', '-c', "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $!; done"]
data_root = ''
namespace = 'default'
controller_id = ''

[provider_process.coding.terminal]
runtime_profile_id = 'sandbox-runtime-coding-shell-v1'
capability_profile_id = 'terminal-v1'
broker_path = '/usr/local/libexec/sandbox-runtime/terminal-broker'
shell_path = '/bin/sh'
max_sessions_per_sandbox = 4
max_sessions_per_controller = 64
shutdown_cleanup_seconds = 10

[provider_process.coding.artifact]
staging_root = ''
active_content_command = []
malware_command = []

# desktop profile: the image must equal the repository-locked publication;
# runtime and restricted-egress ownership identities must match exactly.
[provider_process.desktop]
architecture = '' # amd64 | arm64
usage_retention_seconds = 3600
shutdown_cleanup_seconds = 10

[provider_process.desktop.docker]
host = ''
image = ''
pull_policy = 'if_not_present'
memory_bytes = 1073741824
nano_cpus = 1000000000
pids_limit = 256
inputs_bytes = 16777216
tmpfs_bytes = 268435456
workspace_bytes = 268435456
outputs_bytes = 134217728
operation_timeout_seconds = 90
provenance_timeout_seconds = 120
pull_timeout_seconds = 120
stop_timeout_seconds = 10
data_root = ''
manifest_path = ''
namespace = 'default'
controller_id = ''
network_policy_reference = ''
max_sessions_per_sandbox = 1
max_sessions_per_controller = 16

[provider_process.desktop.provenance]
executable_path = ''
executable_digest = ''

[provider_process.desktop.restricted_network]
host = ''
gateway_image = ''
uplink_network = ''
namespace = 'default'
controller_id = ''
memory_bytes = 134217728
nano_cpus = 500000000
pids_limit = 64
operation_timeout_seconds = 90
stop_timeout_seconds = 10

#[[provider_process.desktop.restricted_network.policies]]
#reference = 'desktop-egress-policy-1'
#allowed_hosts = ['packages.example.test']

# The Provider API is a separate, default-disabled mTLS listener. Enabling it
# requires replacing every placeholder below. Its port must differ from
# server.api.port. TLS files are bounded to 64 KiB for the certificate, 64 KiB
# for the private key, and 256 KiB for the client CA bundle; the bundle may
# contain at most 32 CA certificates. All TLS paths must resolve to regular
# files. Compatibility profiles are descriptive metadata only; they do not
# advertise runtime capabilities.
[server.provider.transport]
enabled = false
server_certificate_file = ''
server_private_key_file = ''
client_ca_bundle_file = ''
# 1..32 exact fragment-free absolute URI SAN identities, each 1..2048 valid
# UTF-8 bytes.
allowed_client_uri_identities = []

[server.provider.transport.address]
host = '127.0.0.1'
port = 8443

[server.provider.capability]
provider_revision_id = ''
# Explicitly requests the canonical coding/shell profile. Startup derives the
# advertisement from the complete dependency graph and fails closed if any
# required component is missing. Keep false until a complete Provider/Gateway
# deployment is available.
coding_shell_enabled = false

[server.provider.capability.limits]
max_cpu_millis = 0
max_memory_bytes = 0
max_ephemeral_storage_bytes = 0
# max_workspace_bytes is optional and must be positive when set.
# max_gpu_count is optional; zero explicitly declares no GPU capacity.
max_lease_seconds = 0
max_exec_seconds = 0

# Enabling the listener requires 1..32 entries supplied through TOML. Do not
# treat this metadata as evidence that snapshot or restore is implemented.
#[[server.provider.capability.snapshot_restore_profiles]]
#profile_id = 'sandbox-snapshot-workspace-v1'
#level = 'workspace'             # workspace | filesystem | process
#suite_id = 'sandbox-provider'
#suite_version = '0.0.0'
#suite_digest = 'sha256:<64 lowercase hexadecimal characters>'

# Protected Provider operations are a separately opt-in transport boundary. An
# enabled listener requires one exact caller issuer and one unique local
# Provider-instance audience; neither has a default or fallback. Use a globally
# unique absolute URI for a generic caller issuer. Startup reads each immutable
# SPKI PUBLIC KEY PEM file once and opens the single-controller guard state
# before the listener accepts traffic. Do not put private keys, bearer values,
# or inline key material in this file.
[server.provider.protected_admission]
enabled = false
issuer = ''
provider_instance_audience = ''
guard_state_file = ''

# Enabling protected admission requires 1..32 unique issuer-scoped entries.
# Every file must contain exactly one regular PUBLIC KEY PEM block; algorithm is
# EdDSA or ES256. Rotation is frozen at startup and uses an overlapping bundle
# plus explicit listener restarts as defined by ADR 0038.
# [[server.provider.protected_admission.trusted_verification_keys]]
# id = 'caller-ed25519-2026-09'
# algorithm = 'EdDSA'
# public_key_file = '/run/secrets/provider-admission/caller-ed25519.pem'

# Provider lifecycle composition is separately gated. Both current drivers are
# development evidence only and production rejects them. Docker requires the
# independent file repository and does not reuse local /instances state.
[server.provider.lifecycle]
enabled = false
driver = 'fake' # fake | docker

[server.provider.lifecycle.repository]
driver = 'memory'             # memory | file

[server.provider.lifecycle.repository.file]
path = 'data/provider-lifecycle.json'

# Required only when server.provider.lifecycle.driver = 'docker'. Replace the
# image with a real sha256 digest and set a stable controller ID before enabling.
[server.provider.lifecycle.docker]
host = ''
image = ''
pull_policy = 'if_not_present'
memory_bytes = 536870912
nano_cpus = 1000000000
pids_limit = 256
tmpfs_bytes = 67108864
operation_timeout_seconds = 30
pull_timeout_seconds = 300
stop_timeout_seconds = 10
user = '65532:65532'
command = ['/bin/sh', '-c', "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $!; done"]
data_root = 'data/provider-runtime'
namespace = 'default'
controller_id = ''

# P2.5e exec composition is separately opt-in and development-only. It requires
# the Docker Provider lifecycle above and an independent single-controller file
# ledger. The canonical profile is advertised only when the complete P2.5h
# readiness graph, including the caller-owned Gateway edge, is available.
[server.provider.exec]
enabled = false
repository_file = 'data/provider-exec.json'

# P2.5f6 terminal composition is independently opt-in and development-only.
# It uses the Provider Docker lifecycle, private single-controller session and
# reference files, and a guest-side broker. It does not expose a Gateway or
# create caller authorization. Its standalone composition cannot advertise the
# canonical profile until the caller-owned Gateway edge is supplied.
[server.provider.terminal]
enabled = false
session_repository_file = 'data/provider-terminal-sessions.json'
reference_registry_file = 'data/provider-terminal-references.json'
runtime_profile_id = 'sandbox-runtime-coding-shell-v1'
capability_profile_id = 'terminal-v1'
broker_path = '/workspace/.sandbox-runtime/terminal-broker'
shell_path = '/bin/sh'
max_sessions_per_sandbox = 4
max_sessions_per_controller = 64
shutdown_cleanup_seconds = 10

# P2.5g artifact staging is independently opt-in and development-only. Both
# scanner fields are direct argv arrays. Artifact bytes are sent through stdin;
# no host path or public artifact URL is passed to the commands.
[server.provider.artifact]
enabled = false
repository_file = 'data/provider-artifacts.json'
staging_root = 'data/provider-artifact-staging'
active_content_command = []
malware_command = []

# Usage evidence is derived only from real retained exec results and remains
# partial provider-local evidence. It is not accounting or billing authority.
[server.provider.usage]
enabled = false
repository_file = 'data/provider-usage.json'

# P4 Browser composition is independently opt-in and development-only. It
# composes the Provider-local lifecycle, signed Chromium runtime, restricted
# egress, protected Browser routes, opaque handoff registry, and usage reader.
# It does not expose a public Browser Gateway and does not advertise
# sandbox.browser. The caller must separately own authorization, revocation,
# audit, reconnect policy, WebSocket admission, and the public listener.
[server.provider.browser]
enabled = false
session_repository_file = 'data/provider-browser-sessions.json'
reference_registry_file = 'data/provider-browser-references.json'
shutdown_cleanup_seconds = 10
usage_retention_seconds = 3600

[server.provider.browser.docker]
host = ''
image = 'ghcr.io/shell-echo/sandbox-runtime-browser@sha256:87d3216c22ada0fea74b375a3ee5c2ddf021d3e1913569e2aeb4a316ed3b5c2f'
pull_policy = 'if_not_present'
memory_bytes = 1073741824
nano_cpus = 1000000000
pids_limit = 256
inputs_bytes = 16777216
tmpfs_bytes = 268435456
workspace_bytes = 268435456
outputs_bytes = 134217728
operation_timeout_seconds = 90
provenance_timeout_seconds = 120
pull_timeout_seconds = 120
stop_timeout_seconds = 10
data_root = 'data/provider-browser-runtime'
manifest_path = 'profiles/browser/image/manifest.json'
seccomp_path = 'profiles/browser/image/chromium-seccomp.json'
namespace = 'default'
controller_id = ''
network_policy_reference = 'browser-egress-policy-1'
max_sessions_per_sandbox = 1
max_sessions_per_controller = 16

[server.provider.browser.provenance]
# Both fields are required when Browser is enabled. executable_digest pins the
# exact gh binary used for Sigstore/SLSA verification.
executable_path = ''
executable_digest = ''

[server.provider.browser.restricted_network]
host = ''
# Use an immutable local image ID or digest-pinned repository reference.
gateway_image = ''
# Must name an explicitly operator-owned network, never bridge/default/host.
uplink_network = ''
namespace = 'default'
controller_id = ''
memory_bytes = 134217728
nano_cpus = 500000000
pids_limit = 64
operation_timeout_seconds = 90
stop_timeout_seconds = 10

[[server.provider.browser.restricted_network.policies]]
reference = 'browser-egress-policy-1'
allowed_hosts = []

# Phase 6 Slice 4 role processes. Each command accepts exactly one enabled
# section. Gateway is public TLS, Guest is outbound-only, and Browser/Desktop
# bind only private TLS 1.3 mTLS listeners. These sections do not configure
# Product, Provider, or the local /instances API.
[gateway_process]
enabled = false
deployment_level = 'production'
public = { host = '127.0.0.1', port = 8445 }
private = { host = '127.0.0.1', port = 8445 }
outbound_url = ''

[gateway_process.probe]
host = '127.0.0.1'
port = 8085

[gateway_process.tls]
certificate_file = ''
private_key_file = ''
client_ca_bundle_file = ''
client_certificate_file = ''
client_private_key_file = ''
allowed_client_identities = []

[gateway_process.authority]
credential_file = ''
dependency_file = ''
policy_file = ''
recording_key_reference = ''
release_profile_file = '' # optional mode-0600 signed Phase 6 role profile

[gateway_process.drain]
grace_seconds = 30
reconnect_seconds = 30
dependency_timeout_seconds = 5

[guest_process]
enabled = false
deployment_level = 'production'
public = { host = '127.0.0.1', port = 0 }
private = { host = '127.0.0.1', port = 0 }
outbound_url = ''

[guest_process.probe]
host = '127.0.0.1'
port = 8086

[guest_process.tls]
certificate_file = ''
private_key_file = ''
client_ca_bundle_file = ''
client_certificate_file = ''
client_private_key_file = ''
allowed_client_identities = []

[guest_process.authority]
credential_file = ''
dependency_file = ''
policy_file = ''
recording_key_reference = ''
release_profile_file = ''

[guest_process.drain]
grace_seconds = 30
reconnect_seconds = 30
dependency_timeout_seconds = 5

[browser_process]
enabled = false
deployment_level = 'production'
public = { host = '127.0.0.1', port = 8446 }
private = { host = '127.0.0.1', port = 8446 }
outbound_url = ''

[browser_process.probe]
host = '127.0.0.1'
port = 8087

[browser_process.tls]
certificate_file = ''
private_key_file = ''
client_ca_bundle_file = ''
client_certificate_file = ''
client_private_key_file = ''
allowed_client_identities = []

[browser_process.authority]
credential_file = ''
dependency_file = ''
policy_file = ''
recording_key_reference = ''
release_profile_file = ''

[browser_process.drain]
grace_seconds = 30
reconnect_seconds = 30
dependency_timeout_seconds = 5

[desktop_process]
enabled = false
deployment_level = 'production'
public = { host = '127.0.0.1', port = 8447 }
private = { host = '127.0.0.1', port = 8447 }
outbound_url = ''

[desktop_process.probe]
host = '127.0.0.1'
port = 8088

[desktop_process.tls]
certificate_file = ''
private_key_file = ''
client_ca_bundle_file = ''
client_certificate_file = ''
client_private_key_file = ''
allowed_client_identities = []

[desktop_process.authority]
credential_file = ''
dependency_file = ''
policy_file = ''
recording_key_reference = ''
release_profile_file = ''

[desktop_process.drain]
grace_seconds = 30
reconnect_seconds = 30
dependency_timeout_seconds = 5

# Phase 6 external dependency references. Values are opaque secret:// or
# kms:// references only; endpoint URLs, tokens, and key bytes are never inline.
[phase6_dependencies.coordination]
enabled = false
endpoint_reference = ''
ca_reference = ''
identity_reference = ''
namespace = 'sandbox-runtime'
operation_timeout_seconds = 3
max_connections = 16

[phase6_dependencies.object_store]
enabled = false
endpoint_reference = ''
ca_reference = ''
identity_reference = ''
bucket = ''
prefix = 'sandbox-runtime'
operation_timeout_seconds = 10
max_object_bytes = 1073741824

[phase6_dependencies.kms]
enabled = false
endpoint_reference = ''
identity_reference = ''
key_reference = ''
cache_seconds = 30
operation_timeout_seconds = 5

[runtime]
driver = 'fake' # fake | docker

[repository]
driver = 'memory' # memory | file; Docker and production require file

[repository.file]
path = 'data/instances.json'

[runtime.docker]
host = ''                       # empty uses DOCKER_HOST or the default Docker socket
image = 'alpine:3.23'
pull_policy = 'if_not_present'  # never | if_not_present | always
memory_bytes = 536870912        # 512 MiB
nano_cpus = 1000000000          # 1 CPU
pids_limit = 256
operation_timeout_seconds = 30  # non-pull Docker API calls
pull_timeout_seconds = 300      # image inspection and pull
stop_timeout_seconds = 10
user = '65532:65532'             # numeric non-root uid:gid inside the runtime image
namespace = 'default'             # isolates managed resources on a shared Docker daemon
controller_id = ''                # required for Docker; stable and unique across deployments
command = ['/bin/sh', '-c', "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $!; done"]
