apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-runtime-ingress
  labels:
    app.kubernetes.io/name: sandbox-runtime
    app.kubernetes.io/component: provider
    app.kubernetes.io/part-of: sandbox-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-runtime
      app.kubernetes.io/component: provider
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              sandbox-runtime.shell-echo.dev/client: "true"
      ports:
        - port: 8080
          protocol: TCP
