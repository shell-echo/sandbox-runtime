apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-runtime
  labels:
    app.kubernetes.io/name: sandbox-runtime
    app.kubernetes.io/component: provider
    app.kubernetes.io/part-of: sandbox-runtime
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-runtime
      app.kubernetes.io/component: provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-runtime
        app.kubernetes.io/component: provider
        app.kubernetes.io/part-of: sandbox-runtime
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox-runtime
          image: sandbox-runtime:local
          imagePullPolicy: Never
          args:
            - serve
          envFrom:
            - configMapRef:
                name: sandbox-runtime
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
